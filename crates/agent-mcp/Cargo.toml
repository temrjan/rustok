[package]
name = "rustok-agent-mcp"
description = "MCP server for rustok agent wallet — HTTP and stdio transports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rustok-agent-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rustok-agent-wallet = { path = "../agent-wallet" }
rustok-agent-dapps = { path = "../agent-dapps" }
rustok-core = { path = "../core" }

axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "fs", "io-std", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
alloy-primitives = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true, features = ["derive"] }
dirs = { workspace = true }
subtle = { workspace = true }
