name: Android Release Build Check

# Verifies that a full release-profile Android APK (arm64-v8a) builds cleanly
# in CI without any signing secrets.
#
# Production release APKs are built and signed strictly offline with the local
# app-signing keystore (see docs/ANDROID-RELEASE.md) — signing keys are never
# stored in GitHub Secrets.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode integer to embed in the APK manifest'
        required: true
        default: '1'
        type: string
      version_name:
        description: 'versionName shown to users, e.g. 1.0.0'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  android-release-check:
    name: Build unsigned arm64-v8a release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free up runner disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h /

      - name: Reject a versionCode that is not a positive integer
        run: |
          case "${{ inputs.version_code }}" in
            ''|*[!0-9]*)
              echo "::error::version_code must be digits only, got '${{ inputs.version_code }}'"
              exit 1 ;;
          esac
          if [ "${{ inputs.version_code }}" -lt 1 ] || [ "${{ inputs.version_code }}" -gt 2100000000 ]; then
            echo "::error::version_code must be between 1 and 2100000000"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      # Targets must match packages/react-native-rustok-bridge/ubrn.config.yaml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools build-tools;36.0.0 ndk;27.1.12297006'

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true

      - name: Install workspace deps
        run: npm ci

      - name: Build + generate uniffi React Native bindings (release profile)
        run: npm run ubrn:android:release -w packages/react-native-rustok-bridge

      - name: Disk space after Rust cross-compile
        run: df -h /

      - name: Build unsigned arm64-v8a release APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PallowUnsignedRelease=true \
            -PversionCode=${{ inputs.version_code }} \
            -PversionName=${{ inputs.version_name }} \
            --no-daemon

      - name: Disk space after Gradle
        if: always()
        run: df -h /

      - name: Verify APK ABI contents, permissions, and 16 KB alignment
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected unsigned release APK at $APK"
            exit 1
          fi
          ls -lh "$APK"
          unzip -l "$APK" | grep 'lib/.*\.so$'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libreact-native-rustok-bridge.so'
          if unzip -l "$APK" | grep -q 'lib/x86_64/'; then
            echo "::error::APK unexpectedly bundles x86_64 native libraries"
            exit 1
          fi
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          PERMS=$("$AAPT2" dump permissions "$APK")
          echo "$PERMS"
          if echo "$PERMS" | grep -q 'EXTERNAL_STORAGE'; then
            echo "::error::APK unexpectedly declares EXTERNAL_STORAGE permission"
            exit 1
          fi
          "$ZIPALIGN" -c -P 16 4 "$APK"
