name: Build and push rustok-agent-mcp

on:
  push:
    branches: [main]
    paths:
      - "crates/agent-mcp/**"
      - "crates/agent-wallet/**"
      - "crates/agent-dapps/**"
      - "crates/core/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".github/workflows/deploy-agent-mcp.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rustok-agent-mcp

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR requires a token with `write:packages` scope.
      # For personal accounts GITHUB_TOKEN does NOT have this scope by default.
      # Create a Classic PAT at https://github.com/settings/tokens with:
      #   - write:packages
      #   - read:packages (implied)
      # Save it as repository secret GHCR_PAT.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./crates/agent-mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
