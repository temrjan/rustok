name: Release rustok-agent-mcp

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rustok-agent-mcp-x86_64-linux
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: rustok-agent-mcp-x86_64-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rustok-agent-mcp-aarch64-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rustok-agent-mcp-x86_64-windows
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin rustok-agent-mcp

      - name: Smoke test
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./target/${{ matrix.target }}/release/rustok-agent-mcp.exe --help
          else
            ./target/${{ matrix.target }}/release/rustok-agent-mcp --help
          fi

      - name: Package (Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rustok-agent-mcp dist/
          cd dist
          tar czf "${{ matrix.artifact_name }}.tar.gz" rustok-agent-mcp
          sha256sum "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Package (Windows)
        if: matrix.archive_ext == 'zip'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/rustok-agent-mcp.exe dist/
          cd dist
          Compress-Archive -Path rustok-agent-mcp.exe -DestinationPath "${{ matrix.artifact_name }}.zip"
          Get-FileHash "${{ matrix.artifact_name }}.zip" -Algorithm SHA256 | Select-Object -ExpandProperty Hash | Out-File -Encoding ascii "${{ matrix.artifact_name }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
