name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --workspace --all-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo doc --workspace --no-deps

  deny:
    name: Deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  skill:
    name: Skill validation (SKILL.md + claw.json + examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md YAML frontmatter
        run: |
          python3 -c "
          import yaml, sys, json
          with open('skills/rustok-wallet/SKILL.md') as f:
              content = f.read()
          parts = content.split('---')
          if len(parts) < 3:
              print('ERROR: Missing YAML frontmatter')
              sys.exit(1)
          frontmatter = yaml.safe_load(parts[1])

          # OpenClaw spec: name + description are required
          required = ['name', 'description']
          for key in required:
              if key not in frontmatter:
                  print(f'ERROR: Missing required key: {key}')
                  sys.exit(1)

          # metadata.openclaw is optional but must be valid JSON if present
          metadata = frontmatter.get('metadata')
          if metadata:
              if not isinstance(metadata, dict):
                  print('ERROR: metadata must be a dict')
                  sys.exit(1)
              openclaw = metadata.get('openclaw')
              if openclaw:
                  requires = openclaw.get('requires', {})
                  if 'bins' in requires:
                      print(f'  requires.bins: {requires[\"bins\"]}')
                  if 'env' in requires:
                      print(f'  requires.env: {requires[\"env\"]}')

          print('SKILL.md YAML frontmatter: OK')
          "
      - name: Validate claw.json
        run: |
          python3 -c "
          import json, sys
          with open('skills/rustok-wallet/claw.json') as f:
              data = json.load(f)
          required = ['name', 'version', 'description', 'author', 'permissions', 'entry']
          for key in required:
              if key not in data:
                  print(f'ERROR: Missing required key in claw.json: {key}')
                  sys.exit(1)
          if data['permissions'] != ['network']:
              print(f'WARNING: Expected permissions [\"network\"], got {data[\"permissions\"]}')
          print('claw.json: OK')
          "
      - name: Validate examples JSON
        run: |
          python3 -c "
          import json
          with open('skills/rustok-wallet/examples/policy.json') as f:
              json.load(f)
          print('examples/policy.json: OK')
          "
      - name: Install OpenClaw CLI
        run: npm install -g openclaw
      - name: Check skill parsing by OpenClaw
        run: |
          # Verify openclaw binary works
          OPENCLAW_BIN=$(npm root -g)/openclaw/openclaw.mjs
          node "$OPENCLAW_BIN" --version
          echo "OpenClaw CLI: OK"

  mobile:
    name: Mobile (typecheck + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Lockfile lives at the repo root (npm workspaces).
          cache: 'npm'
          cache-dependency-path: package-lock.json
      # D4 (CI-MOBILE-BROKEN-INCIDENT § 7): Rust toolchain + cross-compile
      # targets + cargo-ndk + NDK are required for `npm run ubrn:android`
      # to regenerate `packages/react-native-rustok-bridge/src/index.tsx`
      # (gitignored, generated artifact). Without this, `tsc --noEmit`
      # below fails with TS2307 «Cannot find module
      # 'react-native-rustok-bridge'».
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # JDK setup intentionally omitted — `ubrn build android --and-generate`
      # writes templated Kotlin/Java sources to packages/react-native-rustok-
      # bridge/android/src/main/java/ but does NOT invoke Gradle or javac.
      # Compilation of those sources is the consumer app's (mobile/android)
      # responsibility, which is out of scope for this CI job (typecheck +
      # lint + jest only — no Gradle build here).
      - uses: android-actions/setup-android@v3
        with:
          ndk-version: 27.1.12297006
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `npm ci` must run at the repo root so workspaces resolve and
      # all hoisted deps land in <root>/node_modules. The `mobile`
      # working-directory above only applies to the script steps below.
      - name: Install workspace deps
        working-directory: .
        run: npm ci
      - name: Build + generate uniffi React Native bindings
        working-directory: .
        run: npm run ubrn:android -w packages/react-native-rustok-bridge
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
