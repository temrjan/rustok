apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    // npm workspaces: deps hoisted to <repo-root>/node_modules — override RN paths.
    // Default below assumes mobile/node_modules which is empty in workspace setup.
    reactNativeDir = file("../../../node_modules/react-native")
    codegenDir = file("../../../node_modules/@react-native/codegen")
    cliFile = file("../../../node_modules/react-native/cli.js")
    // Same hoisting override as the three above, for the same reason. Missed
    // originally because only release builds bundle JS — debug serves it from
    // Metro — so nothing exercised it until the first bundleRelease.
    //
    // The binary lives in the hermes-compiler package, NOT in react-native:
    // react-native@0.85.2 ships no hermesc at all (only an Xcode build script).
    // PathUtils.kt:243 in @react-native/gradle-plugin resolves
    // node_modules/hermes-compiler/hermesc/%OS-BIN%/ against `root`, which is
    // mobile/ — correct for entryFile and the Metro CWD, but npm workspaces
    // hoist the package to the repository root, so the plugin cannot find it.
    //
    // Do not trust the plugin's error text here: it names
    // react-native/sdks/hermesc/%OS-BIN%/hermesc, a path none of its three
    // lookup steps actually searches, and which no longer exists in this
    // version. That message cost one release run.
    //
    // %OS-BIN% is substituted by the plugin per platform, so the token is
    // appended as a string rather than passed through file().
    hermesCommand = file("../../../node_modules/hermes-compiler/hermesc").absolutePath + "/%OS-BIN%/hermesc"
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * Release signing.
 *
 * Loaded from keystore.properties, which is gitignored and never committed.
 * See keystore.properties.example and docs/ANDROID-RELEASE.md.
 *
 * When the file is absent, releaseSigning stays null and local release builds
 * fail closed (see the taskGraph guard below) rather than silently falling back
 * to the Android debug key.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def releaseSigning = null
if (keystorePropertiesFile.exists()) {
    releaseSigning = new Properties()
    keystorePropertiesFile.withInputStream { releaseSigning.load(it) }
}
def allowUnsignedRelease = project.findProperty("allowUnsignedRelease")?.toString()?.toBoolean() == true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.rustok"
    defaultConfig {
        applicationId "com.rustok"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Overridable via -PversionCode / -PversionName. Must increase
        // monotonically on every published release so Android allows in-place
        // upgrades.
        versionCode (project.hasProperty('versionCode')
            ? project.property('versionCode').toString().toInteger()
            : 1)
        versionName (project.hasProperty('versionName')
            ? project.property('versionName').toString()
            : "1.0.0")
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigning != null) {
            release {
                storeFile file(releaseSigning['storeFile'])
                storePassword releaseSigning['password']
                keyAlias releaseSigning['keyAlias']
                keyPassword releaseSigning['password']
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // No signingConfig when the keystore is absent: the build then fails
            // at execution time via the taskGraph guard below, rather than
            // silently producing a debug-signed artifact. Debug builds stay
            // usable without a keystore — the guard only fires for release tasks.
            if (releaseSigning != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Fail local release builds that have no keystore, instead of silently shipping
// an unsigned or debug-signed artifact. Debug builds keep working without a
// keystore, and secretless CI build verification passes -PallowUnsignedRelease=true.
gradle.taskGraph.whenReady { graph ->
    def needsRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i)(assemble|bundle|install)Release/
    }
    if (needsRelease && releaseSigning == null && !allowUnsignedRelease) {
        throw new GradleException(
            "Release build requires mobile/android/keystore.properties.\n" +
            "Copy keystore.properties.example and fill it in with your local " +
            "offline signing key.\n" +
            "See docs/ANDROID-RELEASE.md."
        )
    }
}
