services:
  rustok-agent-mcp:
    build:
      context: .
      dockerfile: crates/agent-mcp/Dockerfile
    image: ghcr.io/temrjan/rustok-agent-mcp:latest
    environment:
      - RUSTOK_AGENT_PASSWORD=${RUSTOK_AGENT_PASSWORD}
      - MCP_CHAIN_IDS=${MCP_CHAIN_IDS:-421614}
    volumes:
      - rustok-agent-data:/home/rustok/.rustok/agent
    networks:
      - openclaw_default
    command: >
      --host 0.0.0.0
      --port 3000
      --data-dir /home/rustok/.rustok/agent
      --unlock-env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" > /dev/tcp/localhost/3000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rustok-agent-data:

networks:
  openclaw_default:
    external: true
