# cargo-deny configuration for Rustok
# Run: cargo deny check

[graph]
all-features = true

[advisories]
ignore = [
    # paste (via alloy-primitives, ark-ff, and syn-solidity) is an unmaintained
    # compile-time proc-macro; alloy-primitives 1.x still requires paste ^1.0.
    { id = "RUSTSEC-2024-0436", reason = "paste — unmaintained compile-time proc-macro via alloy-primitives, ark-ff, and syn-solidity; no upstream upgrade available" },
    # proc-macro-error2 (via alloy-sol-macro -> txguard) executes only at
    # compile time on our own source; a proc-macro has no runtime attack
    # surface.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is a compile-time-only proc-macro dep (via alloy-sol-macro) — unmaintained, no runtime attack surface" },
    # crypto-bigint 0.5.5 timing variability affects k256 0.13.4 scalar
    # arithmetic (via alloy 1.8 and revm 36). Fixed crypto-bigint >= 0.7.6
    # requires elliptic-curve/k256 0.14, which neither alloy 1.x nor 2.x has
    # adopted yet. Exploitation needs a local side-channel observer and many
    # signatures with the same key, while the wallet signs only on explicit
    # user action; remove when alloy-signer moves to k256 0.14.
    { id = "RUSTSEC-2026-0387", reason = "affected ops are on the k256 scalar path; accepted — no upstream fix in alloy 1.x/2.x; exploitation needs a local side-channel observer and many signatures; remove when alloy-signer moves to k256 0.14" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "AGPL-3.0-or-later",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # `clipboard-win` (transitive from tauri-plugin-clipboard-manager on
    # Windows) ships under Boost 1.0 — permissive, compatible with
    # AGPL/MIT/Apache-2.
    "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Workspace crates use path deps without version (expected)
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
